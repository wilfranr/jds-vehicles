allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false
overrides:
  # GHSA-ggr8-5vv4-36mx (high): agotamiento de pila en deepmerge-ts <8, que arrastra @prisma/config 6.x.
  # Retirar cuando Prisma 6.x declare deepmerge-ts >=8 (o al migrar a Prisma 7+).
  deepmerge-ts: 8.0.2
