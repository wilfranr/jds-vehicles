services:
  db:
    image: mysql:8.0
    container_name: jds_vehiculos_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jds_vehiculos
      MYSQL_USER: jds
      MYSQL_PASSWORD: jds
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'jds', '-pjds']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
    name: jds_vehiculos_mysql_data
