name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jds_vehiculos
          MYSQL_USER: jds
          MYSQL_PASSWORD: jds
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u jds -pjds" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: 'mysql://jds:jds@127.0.0.1:3306/jds_vehiculos'
      AUTH_SECRET: 'ci_pipeline_dummy_secret_for_nextjs_build_at_least_32_characters'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
      NEXT_PUBLIC_WHATSAPP_NUMBER: '573202353168'
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks revisa también el historial

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ steps.nvmrc.outputs.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Falla con vulnerabilidades high/critical en dependencias de producción. Una excepción puntual se justifica
      # con `overrides` en pnpm-workspace.yaml (con el aviso y la condición de retirada) o, si no hay parche,
      # documentándola en el README (sección «Seguridad HTTP y dependencias») y en el PR.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Scan for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: '8.24.2'
          GITLEAKS_SHA256: 'fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
          rm -f gitleaks gitleaks.tar.gz

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Prisma migrations deploy
        run: pnpm prisma migrate deploy

      - name: Seed database with test/demo data
        run: pnpm db:seed

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck (TypeScript)
        run: pnpm typecheck

      - name: Run unit & component tests (Vitest)
        run: pnpm test

      - name: Build Next.js application
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jds_vehiculos
          MYSQL_USER: jds
          MYSQL_PASSWORD: jds
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u jds -pjds" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: 'mysql://jds:jds@127.0.0.1:3306/jds_vehiculos'
      AUTH_SECRET: 'ci_pipeline_dummy_secret_for_nextjs_build_at_least_32_characters'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3100'
      NEXT_PUBLIC_WHATSAPP_NUMBER: '573202353168'
      AUTH_TRUST_HOST: 'true'
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ steps.nvmrc.outputs.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Prisma migrations deploy
        run: pnpm prisma migrate deploy

      - name: Seed database with demo data
        run: pnpm db:seed

      - name: Build Next.js application
        run: pnpm build

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      # Los navegadores (~150 MB) se descargaban en cada ejecución y a veces la descarga se colgaba (F4-09).
      - name: Restore Playwright browsers cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Un intento por vez con tope de 150 s y un reintento: un cuelgue falla en minutos, no en horas.
      - name: Install Playwright Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=10 150 pnpm exec playwright install --with-deps chromium && exit 0
            echo "Intento $attempt fallido"
            # Si el intento colgó, `apt` puede seguir vivo con el bloqueo de dpkg y el reintento fallaría al instante.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x apt || true
            sudo pkill -9 -x dpkg || true
            sudo dpkg --configure -a || true
            sleep 5
          done
          exit 1

      - name: Save Playwright browsers cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Con la caché, solo hacen falta las bibliotecas del sistema (no se cachean).
      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=10 150 pnpm exec playwright install-deps chromium && exit 0
            echo "Intento $attempt fallido"
            # Si el intento colgó, `apt` puede seguir vivo con el bloqueo de dpkg y el reintento fallaría al instante.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x apt || true
            sudo pkill -9 -x dpkg || true
            sudo dpkg --configure -a || true
            sleep 5
          done
          exit 1

      - name: Run E2E tests
        timeout-minutes: 10
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
