name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jds_vehiculos
          MYSQL_USER: jds
          MYSQL_PASSWORD: jds
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u jds -pjds" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: 'mysql://jds:jds@127.0.0.1:3306/jds_vehiculos'
      AUTH_SECRET: 'ci_pipeline_dummy_secret_for_nextjs_build_at_least_32_characters'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
      NEXT_PUBLIC_WHATSAPP_NUMBER: '573202353168'
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ steps.nvmrc.outputs.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Prisma migrations deploy
        run: pnpm prisma migrate deploy

      - name: Seed database with test/demo data
        run: pnpm db:seed

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck (TypeScript)
        run: pnpm typecheck

      - name: Run unit & component tests (Vitest)
        run: pnpm test

      - name: Build Next.js application
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Opcional hasta estabilizarlo (F1-06): un fallo aquí no bloquea el PR.
    continue-on-error: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jds_vehiculos
          MYSQL_USER: jds
          MYSQL_PASSWORD: jds
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u jds -pjds" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: 'mysql://jds:jds@127.0.0.1:3306/jds_vehiculos'
      AUTH_SECRET: 'ci_pipeline_dummy_secret_for_nextjs_build_at_least_32_characters'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3100'
      NEXT_PUBLIC_WHATSAPP_NUMBER: '573202353168'
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ steps.nvmrc.outputs.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Prisma migrations deploy
        run: pnpm prisma migrate deploy

      - name: Seed database with demo data
        run: pnpm db:seed

      - name: Build Next.js application
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
